name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "spikes/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "spikes/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # The JUCE submodule inside Tracktion Engine uses an SSH URL; CI has no SSH key.
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and test (Release)
        shell: cmd
        run: tools\build.cmd windows-release
