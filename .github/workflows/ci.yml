name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "spikes/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "spikes/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        # Debug also fails the tests on any JUCE/Tracktion assertion (see tests/TestMain.cpp).
        preset: [windows-release, windows-debug]

    steps:
      # The JUCE submodule inside Tracktion Engine uses an SSH URL; CI has no SSH key.
      - name: Use HTTPS for GitHub submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build and test (${{ matrix.preset }})
        shell: cmd
        run: tools\build.cmd ${{ matrix.preset }}

      # The installer of the Release build: made, installed, run, uninstalled, then kept for download.
      - name: Installer
        if: matrix.preset == 'windows-release'
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not ($iscc | Where-Object { Test-Path $_ })) {
            choco install innosetup -y --no-progress
          }
          & tools\make-installer.cmd
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Get-ChildItem build\installer\Harmonia-Setup-*.exe | Select-Object -First 1
          & tools\test-installer.ps1 -Installer $setup.FullName
          exit $LASTEXITCODE

      - name: Keep the installer
        if: matrix.preset == 'windows-release'
        uses: actions/upload-artifact@v7
        with:
          name: Harmonia-Setup
          path: build/installer/Harmonia-Setup-*.exe
          if-no-files-found: error
